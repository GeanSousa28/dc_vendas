.exemploFoto{

.exemploFoto img{

#listaFeedbacks div{

.total{

.comprarTudo{

    width:100%;

}

.limpar{

    width:100%;
    margin-top:10px;

.removerBtn{

    border:none;
    color:white;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;

/* FLUTUANTE */
#carrinhoFlutuante{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#00ff88;
    color:black;
    padding:15px 18px;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px rgba(0,255,136,0.5);
    z-index:9999;
}

/* POPUP CARRINHO */
#carrinhoPopup{
    position:fixed;
    bottom:90px;
    right:20px;
    width:320px;
    max-height:400px;
    overflow-y:auto;
    background:rgba(0,0,0,0.95);
    border:2px solid #00ff88;
    border-radius:20px;
    padding:15px;
    display:none;
    z-index:99999;
    box-shadow:0 0 20px rgba(0,255,136,0.5);
}

#carrinhoPopup.ativo{
    display:block;
}

#listaCarrinho{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:10px;
}

.itemCarrinho{
    background:#1c1c1c;
    padding:12px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* ZOOM */
#zoomOverlay{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:99999;
}

#zoomOverlay img{
    max-width:90%;
    max-height:90%;
    border-radius:15px;
    box-shadow:0 0 25px white;
}

input,textarea,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

</style>
